<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>WishNow — Your Special Wish ❤️</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;

    background:
        radial-gradient(
            circle at top,
            #fff0f7,
            #faf7fc 50%,
            #f3ecf8
        );

    color:#29172f;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:25px;
}

.container{
    width:min(760px,100%);
}

.logo{
    text-align:center;
    font-size:28px;
    font-weight:900;
    color:#351449;
    margin-bottom:20px;
}

.logo span{
    color:#e83f91;
}

.card{
    background:#fff;
    border:1px solid #eee1f0;
    border-radius:30px;
    overflow:hidden;
    box-shadow:
        0 25px 70px rgba(60,20,70,.12);
}

.header{
    padding:50px 25px;
    text-align:center;
    color:#fff;

    background:
        linear-gradient(
            135deg,
            #351449,
            #8d3478,
            #e83f91
        );
}

.icon{
    font-size:60px;
    margin-bottom:15px;
}

.header h1{
    font-size:
        clamp(30px,6vw,48px);
    margin-bottom:10px;
}

.header p{
    opacity:.9;
}

.content{
    padding:30px;
}

.photo{
    width:100%;
    max-height:420px;
    object-fit:cover;
    border-radius:22px;
    margin-bottom:25px;
    display:none;
}

.message{
    padding:25px;
    border-radius:22px;

    background:#fff6fa;
    border:1px solid #f2dce8;

    line-height:1.8;
    font-size:17px;

    white-space:pre-wrap;

    margin-bottom:25px;
}

.lock-box{
    padding:25px;
    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #f7f0ff,
            #fff4f8
        );
}

.lock-box h2{
    margin-bottom:8px;
}

.lock-box p{
    color:#77657d;
    line-height:1.6;
    margin-bottom:20px;
}

.question{
    background:#fff;
    padding:18px;
    border-radius:17px;
    margin-bottom:14px;
    border:1px solid #eadfea;
}

.question strong{
    display:block;
    margin-bottom:10px;
}

.question input{
    width:100%;
    padding:12px;

    border:1px solid #dfd2e3;
    border-radius:12px;

    outline:none;
}

.question input:focus{
    border-color:#d83d88;
}

.unlock-btn{
    width:100%;
    border:0;

    padding:15px;
    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            #ff4d91,
            #8d3bd4
        );

    color:#fff;
    font-weight:900;

    margin-top:10px;
}

.result{
    display:none;

    margin-top:20px;
    padding:18px;

    border-radius:17px;

    font-weight:800;
    line-height:1.6;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#8b7b90;
    font-size:13px;
}

.hidden{
    display:none;
}

.success-message{
    margin-top:20px;
    padding:25px;

    border-radius:22px;

    background:
        linear-gradient(
            135deg,
            #fff4f8,
            #f4efff
        );

    text-align:center;

    line-height:1.8;
}

@media(max-width:600px){

    body{
        padding:15px;
    }

    .header{
        padding:40px 20px;
    }

    .content{
        padding:20px;
    }

    .card{
        border-radius:23px;
    }
}

</style>

</head>


<body>


<div class="container">


<div class="logo">
    Wish<span>Now</span> ✨
</div>


<div class="card">


<div class="header">

<div class="icon">
💌
</div>

<h1 id="wishTitle">
A Special Wish ❤️
</h1>

<p id="fromText">
Someone created something special for you.
</p>

</div>


<div class="content">


<img
    id="wishPhoto"
    class="photo"
    alt="Wish photo"
>


<div
    id="wishMessage"
    class="message"
>
Loading your special wish...
</div>


<div
    id="lockBox"
    class="lock-box"
>


<h2>
🔐 WishLock
</h2>


<p>
Answer these 3 questions correctly.
You need <strong>40 out of 60 marks</strong>
to unlock the special wish.
</p>


<div id="questionsContainer"></div>


<button
    id="unlockButton"
    class="unlock-btn"
    onclick="checkAnswers()"
>
🔓 Unlock My Wish
</button>


<div
    id="result"
    class="result"
></div>


</div>


</div>


</div>


<div class="footer">
© 2026 WishNow — Make Every Moment Special. 🎁
</div>


</div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://izvlpqxsxjcvligkgduh.supabase.co";

const SUPABASE_KEY =
"sb_publishable_qjG2krslKEYpujaI9IbT5g_onlfT4LA";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   URL
========================================= */

const params =
new URLSearchParams(
    window.location.search
);


const wishId =
params.get("id");

const urlName =
params.get("name");


/* =========================================
   DATA
========================================= */

let wishData = null;

let questionData = [];


/* =========================================
   LOAD WISH
========================================= */

async function loadWish(){

    const messageBox =
        document.getElementById(
            "wishMessage"
        );


    if(!wishId){

        messageBox.textContent =
            "❌ This Wish link is invalid.";

        document
        .getElementById("lockBox")
        .classList.add("hidden");

        return;
    }


    try{


        /* ---------------------------------
           GET WISH
        --------------------------------- */

        const {
            data: wish,
            error
        } =
        await supabaseClient
        .from("wishes")
        .select("*")
        .eq("id",wishId)
        .single();


        if(error){

            console.error(
                "LOAD WISH ERROR:",
                error
            );

            throw error;
        }


        if(!wish){

            messageBox.textContent =
                "❌ Wish not found.";

            return;
        }


        wishData = wish;


        /* ---------------------------------
           EXPIRY
        --------------------------------- */

        if(
            wish.expires_at &&
            new Date(wish.expires_at)
            <
            new Date()
        ){

            messageBox.textContent =
                "⏰ This Wish link has expired.";

            document
            .getElementById("lockBox")
            .classList.add("hidden");

            return;
        }


        /* ---------------------------------
           TITLE
        --------------------------------- */

        document
        .getElementById("wishTitle")
        .textContent =
            "A Special " +
            wish.occasion +
            " Wish for " +
            wish.recipient_name +
            " ❤️";


        document
        .getElementById("fromText")
        .textContent =
            "From " +
            wish.sender_name +
            " • " +
            wish.template;


        messageBox.textContent =
            wish.message;


        /* ---------------------------------
           PHOTO
        --------------------------------- */

        if(wish.photo_url){

            const photo =
                document
                .getElementById(
                    "wishPhoto"
                );


            photo.src =
                wish.photo_url;


            photo.style.display =
                "block";
        }


        /* ---------------------------------
           GET QUESTIONS
           
           IMPORTANT:
           Correct Supabase columns:
           question_number
           question
           correct_answer
        --------------------------------- */

        const {
            data: questions,
            error: questionError
        } =
        await supabaseClient
        .from("wish_questions")
        .select(
            "id,wish_id,question_number,question,correct_answer,hint"
        )
        .eq(
            "wish_id",
            wishId
        )
        .order(
            "question_number",
            {
                ascending:true
            }
        );


        if(questionError){

            console.error(
                "LOAD QUESTIONS ERROR:",
                questionError
            );

            throw questionError;
        }


        questionData =
            questions || [];


        /* Must have 3 questions */

        if(questionData.length !== 3){

            messageBox.textContent =
                "❌ This Wish does not have exactly 3 WishLock questions.";

            document
            .getElementById("lockBox")
            .classList.add("hidden");

            return;
        }


        renderQuestions();


    }catch(error){

        console.error(error);


        messageBox.textContent =
            "❌ Unable to load this Wish.";


        document
        .getElementById("lockBox")
        .classList.add("hidden");
    }
}


/* =========================================
   RENDER 3 QUESTIONS
========================================= */

function renderQuestions(){

    const container =
        document.getElementById(
            "questionsContainer"
        );


    container.innerHTML = "";


    questionData.forEach(
        (item,index) => {


            container.innerHTML += `

                <div class="question">

                    <strong>
                        ${index + 1}.
                        ${escapeHtml(item.question)}
                    </strong>

                    <input
                        id="answer${index}"
                        type="text"
                        placeholder="Your answer"
                        autocomplete="off"
                    >

                </div>

            `;
        }
    );
}


/* =========================================
   CHECK ANSWERS
========================================= */

async function checkAnswers(){

    if(questionData.length !== 3){

        alert(
            "❌ The 3 WishLock questions could not be loaded."
        );

        return;
    }


    let score = 0;


    /* ---------------------------------
       CHECK EACH ANSWER
    --------------------------------- */

    questionData.forEach(
        (item,index) => {


            const input =
                document.getElementById(
                    "answer" + index
                );


            const userAnswer =
                input.value
                .trim()
                .toLowerCase();


            const correctAnswer =
                String(
                    item.correct_answer
                )
                .trim()
                .toLowerCase();


            if(
                userAnswer &&
                userAnswer === correctAnswer
            ){

                score += 20;
            }

        }
    );


    const result =
        document.getElementById(
            "result"
        );


    result.style.display =
        "block";


    /* =================================
       PASS
    ================================= */

    if(score >= 40){

        result.style.background =
            "#effff5";

        result.style.color =
            "#177245";


        result.innerHTML = `

            🎉 <strong>Congratulations!</strong>

            <br>

            You scored
            ${score}/60.

            <br><br>

            🔓 <strong>
            Your Wish has been unlocked!
            </strong>

        `;


        document
        .getElementById("lockBox")
        .classList.add("hidden");


        /* ---------------------------------
           UPDATE WISH
        --------------------------------- */

        const {
            error
        } =
        await supabaseClient
        .from("wishes")
        .update({

            score:score,

            unlocked:true

        })
        .eq(
            "id",
            wishId
        );


        if(error){

            console.error(
                "UPDATE ERROR:",
                error
            );
        }


        /* ---------------------------------
           SHOW UNLOCKED MESSAGE
        --------------------------------- */

        const content =
            document.querySelector(
                ".content"
            );


        const unlocked =
            document.createElement(
                "div"
            );


        unlocked.className =
            "success-message";


        unlocked.innerHTML = `

            💖 <strong>
            Wish Unlocked Successfully!
            </strong>

            <br><br>

            The special message above
            is now yours to enjoy. 🎁

        `;


        content.appendChild(
            unlocked
        );


    }else{


        /* =================================
           FAIL
        ================================= */

        result.style.background =
            "#fff7e8";

        result.style.color =
            "#8a5a00";


        result.innerHTML = `

            🔒 <strong>
            Not unlocked yet.
            </strong>

            <br>

            You scored
            ${score}/60.

            <br><br>

            You need at least
            <strong>40/60</strong>.

            <br>

            Try again! ❤️

        `;
    }
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(text){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;
}


/* =========================================
   START
========================================= */

loadWish();

</script>

</body>

</html>
